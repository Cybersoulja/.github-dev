name: Update Profile README with Latest Episode

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest episode from RSS feed
        id: rss
        run: |
          # Replace this URL with the actual podcast RSS feed
          RSS_URL="${{ vars.PODCAST_RSS_URL || 'https://beatindablock.com/feed/podcast' }}"

          # Fetch and parse the RSS feed
          RSS_CONTENT=$(curl -s --max-time 30 "$RSS_URL" 2>/dev/null || echo "")

          if [ -z "$RSS_CONTENT" ]; then
            echo "episode_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract latest episode fields using xmllint / grep fallback
          TITLE=$(echo "$RSS_CONTENT" | grep -oP '(?<=<title>).*?(?=</title>)' | sed -n '2p' | sed 's/<!\[CDATA\[//;s/\]\]>//')
          DATE=$(echo "$RSS_CONTENT"  | grep -oP '(?<=<pubDate>).*?(?=</pubDate>)' | head -1)
          LINK=$(echo "$RSS_CONTENT"  | grep -oP '(?<=<link>)https?://[^<]+' | head -1)
          DESC=$(echo "$RSS_CONTENT"  | grep -oP '(?<=<description>).*?(?=</description>)' | sed -n '2p' | sed 's/<!\[CDATA\[//;s/\]\]>//' | cut -c1-200)

          echo "title=$TITLE"     >> $GITHUB_OUTPUT
          echo "date=$DATE"       >> $GITHUB_OUTPUT
          echo "link=$LINK"       >> $GITHUB_OUTPUT
          echo "desc=${DESC}..."  >> $GITHUB_OUTPUT
          echo "episode_found=true" >> $GITHUB_OUTPUT

      - name: Update README episode section
        if: steps.rss.outputs.episode_found == 'true'
        run: |
          TITLE="${{ steps.rss.outputs.title }}"
          DATE="${{ steps.rss.outputs.date }}"
          LINK="${{ steps.rss.outputs.link }}"
          DESC="${{ steps.rss.outputs.desc }}"

          # Replace the section between the markers
          python3 - <<'PYEOF'
          import re, pathlib

          readme = pathlib.Path("profile/README.md")
          content = readme.read_text()

          import os
          title = os.environ.get("TITLE", "")
          date  = os.environ.get("DATE",  "")
          link  = os.environ.get("LINK",  "")
          desc  = os.environ.get("DESC",  "")

          block = f"""<!-- EPISODE-START -->
          ### 🎧 [{title}]({link})
          **Released:** {date}

          {desc}

          ➡️ [Listen now →]({link})
          <!-- EPISODE-END -->"""

          new_content = re.sub(
              r"<!-- EPISODE-START -->.*?<!-- EPISODE-END -->",
              block,
              content,
              flags=re.DOTALL
          )
          readme.write_text(new_content)
          print("README updated.")
          PYEOF
        env:
          TITLE: ${{ steps.rss.outputs.title }}
          DATE:  ${{ steps.rss.outputs.date }}
          LINK:  ${{ steps.rss.outputs.link }}
          DESC:  ${{ steps.rss.outputs.desc }}

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add profile/README.md
          git diff --staged --quiet || git commit -m "chore: update latest podcast episode in profile README [skip ci]"
          git push
